# Goal: build the imge for devboard frontend push to docker hub
name: ci
  on:
    push:
      branches: [master]
    jobs:
      build and push:
        runs-on: ubuntu-latest
    step:
     - name: checkout code
       uses: docker/checkout-action@v4
      - name: Login to Docker Hub
         uses: docker/login-action@v4
         with:
           username: ${{ vars.DOCKERHUB_USERNAME }}
    
           password: ${{ secrets.DOCKERHUB_TOKEN }} 
   
    
      
  
